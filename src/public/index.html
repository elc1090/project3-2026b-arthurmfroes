<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Whiteboard T3</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(24rem, calc(100% - 2rem)); padding: 2rem; border-radius: 1rem; background: white; box-shadow: 0 12px 40px #0f172a18; }
      h1 { margin-top: 0; }
      form { display: grid; gap: .8rem; }
      label { display: grid; gap: .3rem; font-size: .9rem; }
      input, button { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #cbd5e1; border-radius: .5rem; font: inherit; }
      button { cursor: pointer; border: 0; background: #2563eb; color: white; font-weight: 600; }
      button.secondary { background: transparent; color: #1d4ed8; }
      [hidden] { display: none !important; }
      #message { min-height: 1.5em; }
      #board-list { padding-left: 1.3rem; }
      #board-list li { margin: .55rem 0; }
      #board-detail { border-top: 1px solid #e2e8f0; margin-top: 1.5rem; padding-top: .5rem; }
      #board-content { max-height: 24rem; overflow: auto; padding: .75rem; background: #f8fafc; border-radius: .5rem; }
      #board-members li { margin: .55rem 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Whiteboard T3</h1>
      <section id="auth-panel">
        <h2 id="form-title">Entrar</h2>
        <form id="login-form">
          <label>Nome de usuário<input name="username" autocomplete="username" minlength="3" maxlength="32" required></label>
          <label>Senha<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
          <button type="submit">Entrar</button>
        </form>
        <form id="register-form" hidden>
          <label>Nome de usuário<input name="username" autocomplete="username" minlength="3" maxlength="32" required></label>
          <label>Senha (mínimo 8 caracteres)<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
          <button type="submit">Criar conta</button>
        </form>
        <button id="toggle-form" class="secondary" type="button">Criar uma conta</button>
      </section>
      <section id="account-panel" hidden>
        <p>Conectado como <strong id="account-name"></strong>.</p>
        <section id="board-catalog-view">
          <h2>Quadros</h2>
          <form id="create-board-form">
            <label>Novo quadro<input name="title" maxlength="100" placeholder="Ex.: Revisão de arquitetura" required></label>
            <button type="submit">Criar quadro</button>
          </form>
          <label>Buscar quadros<input id="board-search" type="search" placeholder="Filtrar pelo título"></label>
          <ul id="board-list"></ul>
        </section>
        <section id="board-detail" hidden>
          <p><a href="/">← Voltar ao catálogo</a></p>
          <h2 id="board-title"></h2>
          <p id="board-access-message" role="status"></p>
          <section id="access-request-panel" hidden>
            <p id="access-request-status"></p>
            <form id="access-request-form">
              <button type="submit">Solicitar acesso</button>
            </form>
          </section>
          <section id="pending-requests-panel" hidden>
            <h3>Pedidos de acesso</h3>
            <ul id="pending-requests"></ul>
          </section>
          <section id="members-panel" hidden>
            <h3>Membros</h3>
            <ul id="board-members"></ul>
          </section>
          <ul id="board-content"></ul>
        </section>
        <button id="logout-button" type="button">Sair</button>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
