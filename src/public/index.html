<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Whiteboard T3</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(64rem, calc(100% - 2rem)); padding: 2rem; border-radius: 1rem; background: white; box-shadow: 0 12px 40px #0f172a18; }
      h1 { margin-top: 0; }
      form { display: grid; gap: .8rem; }
      label { display: grid; gap: .3rem; font-size: .9rem; }
      input, button { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #cbd5e1; border-radius: .5rem; font: inherit; }
      button { cursor: pointer; border: 0; background: #2563eb; color: white; font-weight: 600; }
      button.secondary { background: transparent; color: #1d4ed8; }
      [hidden] { display: none !important; }
      #message { min-height: 1.5em; }
      #board-list { padding-left: 1.3rem; }
      #board-list li { margin: .55rem 0; }
      #board-detail { border-top: 1px solid #e2e8f0; margin-top: 1.5rem; padding-top: .5rem; }
      #board-members li { margin: .55rem 0; }
      #board-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: .75rem 0; }
      #board-toolbar button { width: auto; }
      #board-toolbar [aria-pressed="true"] { outline: 2px solid #0f172a; outline-offset: 2px; }
      #board-toolbar .tool-group { display: flex; flex-wrap: wrap; gap: .35rem; padding: .35rem; border: 1px solid #e2e8f0; border-radius: .6rem; }
      #board-toolbar .swatch { width: 2rem; height: 2rem; padding: 0; border: 2px solid #cbd5e1; }
      #board-toolbar .swatch[data-board-color="#ffffff"] { border-color: #64748b; }
      #board-image-picker { display: none; }
      #board-image-status { flex-basis: 100%; margin: 0; font-size: .9rem; }
      #board-canvas { display: block; width: 100%; max-width: 800px; height: auto; border: 1px solid #cbd5e1; background: white; touch-action: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Whiteboard T3</h1>
      <section id="auth-panel">
        <h2 id="form-title">Entrar</h2>
        <form id="login-form">
          <label>Nome de usuário<input name="username" autocomplete="username" minlength="3" maxlength="32" required></label>
          <label>Senha<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
          <button type="submit">Entrar</button>
        </form>
        <form id="register-form" hidden>
          <label>Nome de usuário<input name="username" autocomplete="username" minlength="3" maxlength="32" required></label>
          <label>Senha (mínimo 8 caracteres)<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
          <button type="submit">Criar conta</button>
        </form>
        <button id="toggle-form" class="secondary" type="button">Criar uma conta</button>
      </section>
      <section id="account-panel" hidden>
        <p>Conectado como <strong id="account-name"></strong>.</p>
        <section id="board-catalog-view">
          <h2>Quadros</h2>
          <form id="create-board-form">
            <label>Novo quadro<input name="title" maxlength="100" placeholder="Ex.: Revisão de arquitetura" required></label>
            <button type="submit">Criar quadro</button>
          </form>
          <label>Buscar quadros<input id="board-search" type="search" placeholder="Filtrar pelo título"></label>
          <ul id="board-list"></ul>
        </section>
        <section id="board-detail" hidden>
          <p><a href="/">← Voltar ao catálogo</a></p>
          <h2 id="board-title"></h2>
          <p id="board-access-message" role="status"></p>
          <section id="access-request-panel" hidden>
            <p id="access-request-status"></p>
            <form id="access-request-form">
              <button type="submit">Solicitar acesso</button>
            </form>
          </section>
          <section id="pending-requests-panel" hidden>
            <h3>Pedidos de acesso</h3>
            <ul id="pending-requests"></ul>
          </section>
          <section id="members-panel" hidden>
            <h3>Membros</h3>
            <ul id="board-members"></ul>
          </section>
          <div id="board-workspace" hidden>
            <div id="board-toolbar" aria-label="Ferramentas do quadro">
              <button type="button" data-board-tool="select" aria-pressed="true" title="Selecionar / mover (S)">Selecionar / mover</button>
              <button type="button" data-board-tool="pen" aria-pressed="false" title="Caneta (P)">Caneta</button>
              <button type="button" data-board-tool="highlighter" aria-pressed="false" title="Marca-texto (H)">Marca-texto</button>
              <button type="button" data-board-tool="line" aria-pressed="false" title="Linha (L)">Linha</button>
              <button type="button" data-board-tool="arrow" aria-pressed="false" title="Seta (A)">Seta</button>
              <button type="button" data-board-tool="rectangle" aria-pressed="false" title="Retângulo (R)">Retângulo</button>
              <button type="button" data-board-tool="mux" aria-pressed="false" title="MUX (M)">MUX</button>
              <button type="button" data-board-tool="alu" aria-pressed="false" title="ULA / ALU (U)">ULA / ALU</button>
              <button type="button" data-board-tool="text" aria-pressed="false" title="Texto (T)">Texto</button>
              <button type="button" data-board-tool="eraser" aria-pressed="false" title="Borracha (E)">Borracha</button>
              <button type="button" data-board-tool="pan" aria-pressed="false" title="Mover tela (Espaço)">Mover tela</button>
              <span class="tool-group" role="group" aria-label="Cor do traço">
                <button type="button" class="swatch" data-board-color="#1e293b" aria-label="Cor preta" aria-pressed="true" style="background:#1e293b"></button>
                <button type="button" class="swatch" data-board-color="#dc2626" aria-label="Cor vermelha" aria-pressed="false" style="background:#dc2626"></button>
                <button type="button" class="swatch" data-board-color="#2563eb" aria-label="Cor azul" aria-pressed="false" style="background:#2563eb"></button>
                <button type="button" class="swatch" data-board-color="#16a34a" aria-label="Cor verde" aria-pressed="false" style="background:#16a34a"></button>
                <button type="button" class="swatch" data-board-color="#ffffff" aria-label="Cor branca" aria-pressed="false" style="background:#fff"></button>
              </span>
              <span class="tool-group" role="group" aria-label="Espessura do traço">
                <button type="button" data-board-size="2" aria-pressed="true">Fina</button>
                <button type="button" data-board-size="4" aria-pressed="false">Média</button>
                <button type="button" data-board-size="8" aria-pressed="false">Grossa</button>
                <button type="button" data-board-size="16" aria-pressed="false">Extra grossa</button>
              </span>
              <button type="button" data-board-action="clear">Limpar quadro</button>
              <button type="button" data-board-action="zoom-out" aria-label="Diminuir zoom">−</button>
              <button type="button" data-board-action="zoom-in" aria-label="Aumentar zoom">+</button>
              <button type="button" data-board-action="zoom-reset">Zoom 1:1</button>
              <button type="button" data-board-action="fit">Enquadrar tudo</button>
              <button type="button" data-board-image-add>Adicionar imagem</button>
              <input id="board-image-picker" type="file" accept="image/png,image/jpeg,image/gif,image/webp" data-board-image-picker>
              <button type="button" data-board-template-add>Inserir modelo FSM</button>
              <button type="button" data-board-undo disabled>Desfazer</button>
              <button type="button" data-board-redo disabled>Refazer</button>
              <p id="board-image-status" data-board-image-status role="status" aria-live="polite"></p>
            </div>
            <canvas id="board-canvas" width="800" height="480" aria-label="Canvas compartilhado"></canvas>
          </div>
        </section>
        <button id="logout-button" type="button">Sair</button>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
